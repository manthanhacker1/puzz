<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Invitation</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #fde8ed; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
    .screen { display: none; }
    .screen.active { display: block; }
    h2 { color: #333; margin-bottom: 20px; font-size: 24px; }
    .img-container { margin-bottom: 20px; }
    .img-container img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
    .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    button { background-color: #fca5a5; color: white; border: none; padding: 10px 24px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #f87171; }
    #noBtn { background-color: #e5e7eb; color: #374151; position: relative; }
    .input-group { margin: 15px 0; text-align: left; }
    label { display: block; font-size: 14px; color: #6b7280; margin-bottom: 5px; }
    input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 10px; outline: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
    .grid-item { border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; cursor: pointer; }
    .grid-item.selected { border-color: #f87171; background-color: #fff1f2; }
    .grid-item span { display: block; font-size: 24px; margin-bottom: 5px; }
    .ps-text { font-size: 12px; color: #9ca3af; margin-top: 15px; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <div id="screen1" class="screen active">
      <div class="img-container">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=300&q=80" alt="Cute Dog">
      </div>
      <h2>Will you go on a date with me? 🌸</h2>
      <div class="btn-group">
        <button id="yesBtn">YES 💕</button>
        <button id="noBtn">NO 💔</button>
      </div>
    </div>

    <div id="screen2" class="screen">
      <h2>Wait... YOU ACTUALLY SAID YES?? 🥳</h2>
      <p style="color: #6b7280; margin-bottom: 20px;">I was ready for you to say no 🥹</p>
      <button onclick="nextScreen(3)">okay okay! 🎉</button>
    </div>

    <div id="screen3" class="screen">
      <h2>So... when are you free? 📅</h2>
      <div class="input-group">
        <label>Pick a Day 🗓️</label>
        <input type="date" id="dateInput">
      </div>
      <div class="input-group">
        <label>What Time? ⏰</label>
        <select id="timeInput">
          <option value="">Select a time...</option>
          <option value="4:00 PM">4:00 PM</option>
          <option value="5:00 PM">5:00 PM</option>
          <option value="6:00 PM">6:00 PM</option>
          <option value="7:00 PM">7:00 PM</option>
          <option value="8:00 PM">8:00 PM</option>
        </select>
      </div>
      <button style="width: 100%; margin-top: 10px;" onclick="saveDateTime()">set the date! 💕</button>
    </div>

    <div id="screen4" class="screen">
      <h2>What are we feeling? 🍽️✨</h2>
      <p style="font-size: 12px; color: #6b7280;">pick your vibe</p>
      <div class="grid">
        <div class="grid-item" onclick="selectVibe(this, 'Pizza')"><span>🍕</span>Pizza</div>
        <div class="grid-item" onclick="selectVibe(this, 'Sushi')"><span>🍣</span>Sushi</div>
        <div class="grid-item" onclick="selectVibe(this, 'Burgers')"><span>🍔</span>Burgers</div>
        <div class="grid-item" onclick="selectVibe(this, 'Pasta')"><span>🍝</span>Pasta</div>
        <div class="grid-item" onclick="selectVibe(this, 'Tacos')"><span>🌮</span>Tacos</div>
        <div class="grid-item" onclick="selectVibe(this, 'Ramen')"><span>🍜</span>Ramen</div>
      </div>
      <button style="width: 100%; margin-top: 20px;" onclick="nextScreen(5)">let's go! 🚀</button>
    </div>

    <div id="screen5" class="screen">
      <h2>Glad you didn't say no. Be ready! 🍒</h2>
      <p id="summaryText" style="color: #4b5563; margin: 15px 0; font-weight: 500;"></p>
      <button style="width: 100%;" onclick="alert('It\'s a date! ❤️')">ok I accept! 🥰</button>
      <p class="ps-text">P.S. I made a website for you, no big deal 💕</p>
    </div>
  </div>

  <script>
    let selectedDate = '', selectedTime = '', selectedVibeText = 'Food';
    function nextScreen(n) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen' + n).classList.add('active');
    }
    document.getElementById('yesBtn').addEventListener('click', () => {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      nextScreen(2);
    });
    const noBtn = document.getElementById('noBtn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 140 - 70, y = Math.random() * 140 - 70;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });
    function saveDateTime() {
      selectedDate = document.getElementById('dateInput').value;
      selectedTime = document.getElementById('timeInput').value;
      if (!selectedDate || !selectedTime) return alert('Pick date and time!');
      nextScreen(4);
    }
    function selectVibe(el, vibe) {
      document.querySelectorAll('.grid-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      selectedVibeText = vibe;
    }
    const observer = new MutationObserver(() => {
      if (document.getElementById('screen5').classList.contains('active')) {
        document.getElementById('summaryText').innerText = `See you on ${selectedDate} at ${selectedTime} for ${selectedVibeText}!`;
      }
    });
    observer.observe(document.getElementById('screen5'), { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
